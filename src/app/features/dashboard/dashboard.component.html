<div class="dashboard">
  <h2>Dashboard</h2>

  @if (role() === 'admin') {
    <app-stats-card />
    <div class="charts-grid">
      <app-dept-chart />
      <app-role-chart />
      <app-leaves-chart />
    </div>
  }

  @if (role() === 'manager') {
      <app-manager-dashboard />
  }

  @if (role() === 'employee') {
    <app-employee-dashboard />
  }
</div>
